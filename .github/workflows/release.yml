name: Package release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  package:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check version and live acceptance
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          node tools/check-release-gates.cjs --tag "$env:RELEASE_TAG" | Tee-Object -FilePath release/LIVE-ACCEPTANCE.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release acceptance checks failed' }
      - name: Build addon archive
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          ./tools/package.ps1 -Version $version
      - name: Record package checksum
        shell: pwsh
        run: |
          $file = Get-ChildItem -LiteralPath release -Filter '*.zip' | Select-Object -First 1
          $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content -LiteralPath release/SHA256SUMS.txt
      - name: Publish GitHub release archive
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/SHA256SUMS.txt
            release/LIVE-ACCEPTANCE.txt
          body_path: release/LIVE-ACCEPTANCE.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: false
          overwrite_files: false
          fail_on_unmatched_files: true
          generate_release_notes: true
